<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Demographics Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            gap: 25px;
        }
        .panel {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .right-panel {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        video, canvas {
            width: 100%;
            max-width: 540px;
            border-radius: 8px;
            background-color: #000;
            transform: scaleX(-1); /* Mirrors the camera view for natural usage */
        }
        canvas { display: none; } /* Hidden; used purely to capture images */
        
        .status-badge {
            background-color: #ef4444;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
        .stat-group {
            border-left: 4px solid #38bdf8;
            padding-left: 15px;
            margin-bottom: 10px;
        }
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #f1f5f9;
        }
        .progress-bar-container {
            background-color: #334155;
            border-radius: 8px;
            height: 10px;
            width: 100%;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: #38bdf8;
            height: 100%;
            width: 0%;
            transition: width 0.15s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>AI Facial Demographic Analysis Portal</h1>

    <div class="container">
        <div class="panel left-panel">
            <h2 style="margin-top:0; color:#94a3b8;">Live Feed</h2>
            <video id="webcam" autoplay playsinline></video>
            <canvas id="captureCanvas" width="640" height="480"></canvas>
            <div id="connectionStatus" class="status-badge">Server Disconnected</div>
        </div>

        <div class="panel right-panel">
            <h2 style="margin-top:0; color:#b2fff5;">Demographic Insights</h2>
            
            <div class="stat-group">
                <div class="stat-label">Estimated Age Group</div>
                <div id="ageValue" class="stat-value">--</div>
                <div class="progress-bar-container"><div id="ageProgress" class="progress-bar"></div></div>
            </div>

            <div class="stat-group">
                <div class="stat-label">Predicted Gender</div>
                <div id="genderValue" class="stat-value">--</div>
                <div class="progress-bar-container"><div id="genderProgress" class="progress-bar"></div></div>
            </div>

            <div class="stat-group">
                <div class="stat-label">Ethnicity / Race Group</div>
                <div id="raceValue" class="stat-value">--</div>
                <div class="progress-bar-container"><div id="raceProgress" class="progress-bar"></div></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
